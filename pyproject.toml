[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-application-orchestrator"
version = "0.1.0"
description = "Local browser-driven job application orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "playwright>=1.49,<2",
  "openai>=1.0,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pypdf>=5,<6",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: browser end-to-end test",
    "live: calls real external API, skipped in CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "E701", "E702", "UP017"]
